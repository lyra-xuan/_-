name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONOPTIMIZE: 1
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pip dependencies
        run: pip install -U -r requirements-build.txt
      - name: Setup UPX
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            choco install upx --no-progress
          elif [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt install upx-ucl
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install upx
          fi
      - name: Set vars
        id: vars
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ext=".exe"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            ext=""
          elif [ "$RUNNER_OS" == "macOS" ]; then
            ext=".zip"
          fi
          echo "ext=${ext}" >> $GITHUB_OUTPUT
          echo "executableName=th06-scarlet-mist-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)-${{ runner.os }}${ext}" >> $GITHUB_OUTPUT
      - name: Build executable
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export pyiSeparator=";"
          fi
          bash build.sh
          if [ "$RUNNER_OS" == "Windows" ]; then
            upx --ultra-brute dist/th06-scarlet-mist${{ steps.vars.outputs.ext }}
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            cd dist
            zip -r9 ${{ steps.vars.outputs.executableName }} th06-scarlet-mist.app
            cd ..
          else
            mv dist/th06-scarlet-mist${{ steps.vars.outputs.ext }} dist/${{ steps.vars.outputs.executableName }}
          fi
          ls -l dist
      - name: Get SHA-256 checksum of built executable
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            openssl sha256 dist/th06-scarlet-mist.app/Contents/MacOS/th06-scarlet-mist
          else
            openssl sha256 dist/${{ steps.vars.outputs.executableName }}
          fi
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: th06-scarlet-mist-${{ runner.os }}
          path: dist/${{ steps.vars.outputs.executableName }}
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.vars.outputs.executableName }}
          generate_release_notes: true
          draft: false
          name: 东方红雾录 ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
